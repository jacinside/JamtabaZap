name: Build JamtabaZap

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  workflow_dispatch:

env:
  JAMTABA_VERSION: 0.1.0-${{ github.run_number }}

jobs:
  windows-x64:
    runs-on: ubuntu-latest
    container:
      image: defter/jamtaba-win64:v5.15.7
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg with x264
        shell: bash
        run: .github/scripts/ffmpeg-with-x264.sh x86_64-w64-mingw32.static-
      - name: Build
        shell: bash
        run: |
          which qmake; qmake -v
          (cd PROJECTS/VstScanner && qmake VstScanner.pro CONFIG+=release && make -k -j$(nproc))
          cd PROJECTS/Standalone
          qmake Standalone.pro CONFIG+=release
          make -k -j$(nproc)
          find . -name '*.exe'
          grep -q libx264 release/JamtabaZap.exe || { echo "the executable has no libx264"; exit 1; }
          test -f release/VstScanner.exe
      - uses: actions/upload-artifact@v4
        with:
          name: JamtabaZap-windows-x64
          path: PROJECTS/Standalone/**/*.exe
          if-no-files-found: error

  linux-x64:
    runs-on: ubuntu-latest
    container:
      image: defter/jamtaba-linux:v5.15.7
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg with x264
        shell: bash
        run: .github/scripts/ffmpeg-with-x264.sh
      - name: Build
        shell: bash
        run: |
          which qmake; qmake -v
          (cd PROJECTS/VstScanner && qmake VstScanner.pro CONFIG+=release && make -k -j$(nproc))
          cd PROJECTS/Standalone
          qmake Standalone.pro CONFIG+=release
          make -k -j$(nproc)
          find . -type f -name 'JamtabaZap*'
          grep -q libx264 JamtabaZap || { echo "the executable has no libx264"; exit 1; }
          test -f VstScanner
      - uses: actions/upload-artifact@v4
        with:
          name: JamtabaZap-linux-x64
          path: |
            PROJECTS/Standalone/**/JamtabaZap
            PROJECTS/Standalone/**/VstScanner
          if-no-files-found: error

  macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Qt and the static libraries
        run: |
          python3 -m venv .aqt && .aqt/bin/pip -q install aqtinstall
          .aqt/bin/aqt install-qt mac desktop 5.15.2 clang_64 -O .qt
          curl -sSL -o libs.zip 'https://www.dropbox.com/s/qckwsmaqlditwpb/JamTaba-static-libs.zip?dl=1'
          echo '9e37dabea1daa59b34e76d26e2b6473af1613f6b0255c14bff3c87c4d0e5b997  libs.zip' | shasum -a 256 -c -
          unzip -q libs.zip
      - name: Build
        run: |
          Q=$PWD/.qt/5.15.2/clang_64/bin
          mkdir build && cd build
          $Q/qmake ../PROJECTS/Standalone/Standalone.pro CONFIG+=release CONFIG-=debug CONFIG+=sdk_no_version_check \
            QMAKE_APPLE_DEVICE_ARCHS=x86_64 QMAKE_MACOSX_DEPLOYMENT_TARGET=10.15 "QMAKE_LIBS_OPENGL=-framework OpenGL" \
            QMAKE_LFLAGS+=-Wl,-platform_version,macos,10.15,10.15
          make -k -j$(sysctl -n hw.ncpu)
          (mkdir ../build-scanner && cd ../build-scanner && $Q/qmake ../PROJECTS/VstScanner/VstScanner.pro -after DESTDIR=$PWD/../build/JamtabaZap.app/Contents/MacOS CONFIG+=release CONFIG-=debug CONFIG+=sdk_no_version_check \
            QMAKE_APPLE_DEVICE_ARCHS=x86_64 QMAKE_MACOSX_DEPLOYMENT_TARGET=10.15 "QMAKE_LIBS_OPENGL=-framework OpenGL" \
            QMAKE_LFLAGS+=-Wl,-platform_version,macos,10.15,10.15 && make -k -j$(sysctl -n hw.ncpu))
          test -f JamtabaZap.app/Contents/MacOS/VstScanner
          $Q/macdeployqt JamtabaZap.app -executable=JamtabaZap.app/Contents/MacOS/VstScanner
          codesign --force --sign - --deep JamtabaZap.app
          ditto -c -k --keepParent JamtabaZap.app JamtabaZap-macos-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JamtabaZap-macos-x86_64
          path: build/JamtabaZap-macos-x86_64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-x64, linux-x64, macos-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          (cd artifacts/JamtabaZap-windows-x64 && zip -qj ../../out/JamtabaZap-windows-x64.zip $(find . -name JamtabaZap.exe) $(find . -name VstScanner.exe))
          (cd artifacts/JamtabaZap-linux-x64 && chmod +x $(find . -name JamtabaZap) $(find . -name VstScanner) && zip -qj ../../out/JamtabaZap-linux-x64.zip $(find . -name JamtabaZap) $(find . -name VstScanner))
          cp artifacts/JamtabaZap-macos-x86_64/JamtabaZap-macos-x86_64.zip out/
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --prerelease --title "JamtabaZap $GITHUB_REF_NAME" --notes "Beta. See the README for how to install it and its known limits."
